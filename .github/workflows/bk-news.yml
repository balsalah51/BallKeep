name: BK News hourly

# Story HTML rotates every hour. Rebuild news hubs and feeds only, then
# commit those paths — never git add -A. A full site rebuild was rewriting
# ranking pages and leftover story files, which produced modify/delete
# conflicts on every open PR.

on:
  schedule:
    # 12 minutes past every hour — cheap RSS + a rotating player slice.
    - cron: "12 * * * *"
  workflow_dispatch:
    inputs:
      sport:
        description: "football, baseball, soccer, basketball, both, or all"
        default: all
        type: choice
        options:
          - all
          - both
          - football
          - baseball
          - soccer
          - basketball

concurrency:
  group: bk-news
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test news algorithm
        run: python3 scripts/test_news.py

      - name: Scrape wires
        run: python3 scripts/news_scrape.py --sport "${{ github.event.inputs.sport || 'all' }}"

      - name: Pull The X tape
        run: python3 scripts/x_tape.py --sport all

      - name: Rebuild news pages only
        run: python3 scripts/build_site.py --news-only

      - name: Catalog smoke test
        run: python3 bot/test_catalog.py

      - name: Commit news files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Never git add -A. Ranking boards and player files stay off this
          # hourly commit so open PRs do not inherit modify/delete conflicts
          # when stories rotate.
          git add \
            data/news \
            data/x-tape \
            img/x-tape \
            news.html \
            news \
            bb/news.html \
            bb/news \
            bk/news.html \
            bk/news \
            pl/news.html \
            pl/news \
            feed.xml \
            bb/feed.xml \
            bk/feed.xml \
            pl/feed.xml \
            sitemap-news.xml
          if git diff --cached --quiet; then
            echo "No news changes"
            exit 0
          fi
          git commit -m "Refresh BK News ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
