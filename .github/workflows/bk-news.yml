name: BK News hourly

on:
  schedule:
    # 12 minutes past every hour — cheap RSS + a rotating player slice.
    - cron: "12 * * * *"
  workflow_dispatch:
    inputs:
      sport:
        description: "football, baseball, or both"
        default: both
        type: choice
        options:
          - both
          - football
          - baseball

concurrency:
  group: bk-news
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test news algorithm
        run: python3 scripts/test_news.py

      - name: Scrape wires
        run: python3 scripts/news_scrape.py --sport "${{ github.event.inputs.sport || 'both' }}"

      - name: Rebuild site
        run: python3 scripts/build_site.py

      - name: Catalog smoke test
        run: python3 bot/test_catalog.py

      - name: Commit and push if the wire moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No news changes"
            exit 0
          fi
          git commit -m "Refresh BK News ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
