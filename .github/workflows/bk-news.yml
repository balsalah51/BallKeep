name: BK News

# News HTML is committed on a short allow-list. A full site rebuild is the
# daily job. Cron is UTC. Every 3 hours through the season.

on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      sport:
        description: "football, baseball, soccer, basketball, both, or all"
        default: all
        type: choice
        options:
          - all
          - both
          - football
          - baseball
          - soccer
          - basketball

concurrency:
  group: ballkeep-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test news algorithm
        run: python3 scripts/test_news.py

      - name: Scrape wires
        run: python3 scripts/news_scrape.py --sport "${{ github.event.inputs.sport || 'all' }}"

      - name: Fail if the football wire is stale
        run: python3 scripts/check_freshness.py --ranks-hours 240 --news-hours 26 --news-required

      - name: Pull The X tape
        run: python3 scripts/x_tape.py --sport all

      - name: Rebuild news pages only
        run: python3 scripts/build_site.py --news-only

      - name: Commit news files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/news \
            data/x-tape \
            img/x-tape \
            news.html \
            news \
            bb/news.html \
            bb/news \
            bk/news.html \
            bk/news \
            pl/news.html \
            pl/news \
            feed.xml \
            bb/feed.xml \
            bk/feed.xml \
            pl/feed.xml \
            sitemap-news.xml
          if git diff --cached --quiet; then
            echo "No news changes"
            exit 0
          fi
          git commit -m "Refresh BK News ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
