name: Weekly check (Monday and Tuesday)

# 14:00 UTC is 10:00 AM Eastern during daylight time and 9:00 AM Eastern
# after the clocks fall back. The job scrapes, then refuses to stamp or
# commit when FantasyPros or the injury wire comes back empty.

on:
  schedule:
    - cron: "0 14 * * 1,2"
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week number (blank = auto from America/New_York)"
        required: false
        default: ""

concurrency:
  group: ballkeep-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape weekly boards
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            python3 scripts/scrape_weekly.py "${{ github.event.inputs.week }}"
          else
            python3 scripts/scrape_weekly.py
          fi

      - name: Fail if the scrape did not land
        run: python3 scripts/check_freshness.py --ranks-hours 6 --news-hours 240

      - name: Rebuild site
        run: python3 scripts/build_site.py

      - name: Week and SEO tests
        run: |
          python3 scripts/test_nfl_week.py
          python3 scripts/test_news.py
          python3 scripts/test_seo.py

      - name: Commit and push if the week moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No weekly changes"
            exit 0
          fi
          git commit -m "Weekly check ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
