name: Weekly check (Monday and Tuesday)

on:
  schedule:
    # 10:00 ET Monday and Tuesday (14:00 UTC).
    - cron: "0 14 * * 1,2"
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week number (blank = auto)"
        required: false
        default: ""

concurrency:
  group: weekly-check
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape weekly boards
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            python3 scripts/scrape_weekly.py "${{ github.event.inputs.week }}"
          else
            python3 scripts/scrape_weekly.py
          fi

      - name: Rebuild site
        run: python3 scripts/build_site.py

      - name: SEO tests
        run: python3 scripts/test_seo.py

      - name: Catalog smoke test
        run: python3 bot/test_catalog.py

      - name: Commit and push if the week moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No weekly changes"
            exit 0
          fi
          git commit -m "Weekly check ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
